<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e9ecf2">
<title>הפלייליסטים של לירם</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9ecf2; --hi:#ffffff; --lo:#bcc3cf; --ink:#2b3140; --ink2:#6b7385; --ink3:#9aa1ae;
  --wheel:#f3f5f8; --screen:#16171f;
  --c:#a050ff; --d:#7a2fd6;
  --ease:cubic-bezier(.2,.9,.3,1.15);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Rubik,system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--c);outline-offset:3px}

.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;padding:max(18px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left))}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:6px}
.brand{display:flex;align-items:center;gap:14px}
.brand h1{margin:0;font-size:clamp(22px,2.6vw,30px);font-weight:700;letter-spacing:-.5px}
.brand .sub{font-size:14px;color:var(--ink2)}
.chip{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:99px;background:var(--bg);box-shadow:5px 5px 12px var(--lo),-5px -5px 12px var(--hi);font-size:14px;color:var(--ink2)}
.chip i{width:10px;height:10px;border-radius:50%;background:#e24b4a}
.chip.ok i{background:#1db954}

/* main stage */
.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,34%);gap:24px;min-height:0}

/* carousel */
.car{position:relative;min-height:0;touch-action:pan-y;overflow:hidden}
.slot{position:absolute;left:50%;bottom:4%;transform-origin:50% 100%;transition:transform .6s var(--ease),opacity .4s,filter .4s;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.badge{width:112px;height:112px;border-radius:30px;margin-bottom:26px;display:flex;align-items:center;justify-content:center;font-size:60px;background:linear-gradient(160deg,#fff,#e2e6ee);box-shadow:10px 12px 24px var(--lo),-8px -8px 20px var(--hi);transition:opacity .35s,transform .45s var(--ease)}
.bname{position:absolute;top:122px;font-size:22px;font-weight:500;color:var(--ink2);white-space:nowrap;transition:opacity .3s}
.slot.on .badge,.slot.on .bname{opacity:0;transform:translateY(30px) scale(.6);pointer-events:none}

.nano{--h:min(66vh,560px);height:var(--h);width:calc(var(--h)*.53);border-radius:calc(var(--h)*.075);position:relative;display:flex;flex-direction:column;align-items:center;padding-top:calc(var(--h)*.045);
  background:linear-gradient(90deg,var(--pd) 0%,var(--pc) 42%,var(--pc) 58%,var(--pd) 100%);
  box-shadow:22px 26px 50px #aab2c0,-16px -16px 36px var(--hi),inset 0 2px 0 #ffffff55,inset 0 -3px 0 #00000022}
.nano::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(120deg,#ffffff38 0%,transparent 30%,transparent 70%,#ffffff1a 100%);pointer-events:none}

.scr{width:84%;aspect-ratio:1.12;background:#07080b;border-radius:calc(var(--h)*.022);padding:calc(var(--h)*.009);box-shadow:inset 0 0 0 2px #0008;position:relative;z-index:1}
.scr-in{height:100%;border-radius:calc(var(--h)*.014);background:var(--screen);color:#fff;padding:7% 8%;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.st{font-size:calc(var(--h)*.027);color:var(--pc);display:flex;justify-content:space-between}
.pn{font-size:calc(var(--h)*.036);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tn,.an{text-align:right}
.tn{font-size:calc(var(--h)*.042);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4%}
.an{font-size:calc(var(--h)*.028);color:#aab0c0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:5px;background:#ffffff22;border-radius:3px;overflow:hidden;margin-top:auto}
.bar b{display:block;height:100%;width:0;background:var(--pc);border-radius:3px}
.eq{display:flex;gap:4%;align-items:flex-end;height:18%;margin-top:6%}
.eq i{flex:1;border-radius:2px;background:var(--pc);height:10%;transition:height .2s}
.playing .eq i{animation:eq .75s infinite ease-in-out}
.eq i:nth-child(2){animation-delay:.12s}.eq i:nth-child(3){animation-delay:.3s}.eq i:nth-child(4){animation-delay:.05s}.eq i:nth-child(5){animation-delay:.22s}.eq i:nth-child(6){animation-delay:.38s}.eq i:nth-child(7){animation-delay:.16s}.eq i:nth-child(8){animation-delay:.27s}.eq i:nth-child(9){animation-delay:.09s}
@keyframes eq{0%,100%{height:10%}50%{height:100%}}

.wh{margin-top:calc(var(--h)*.05);width:86%;aspect-ratio:1;border-radius:50%;background:var(--wheel);position:relative;display:flex;align-items:center;justify-content:center;z-index:1;
  box-shadow:inset 0 3px 8px #0000001f,inset 0 -2px 4px #ffffffaa,0 1px 0 #ffffff66;touch-action:none}
.wb{all:unset;position:absolute;width:24%;height:24%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#5b6272;font-size:calc(var(--h)*.05);transition:transform .1s}
.wb.menu{top:2%;font-size:calc(var(--h)*.03);font-weight:700;letter-spacing:2px}
.wb.prev{left:2%}.wb.next{right:2%}
.wb.pp{bottom:2%;font-size:calc(var(--h)*.034);letter-spacing:-1px}
.wb:active{transform:scale(.78)}
.ctr{all:unset;cursor:pointer;width:38%;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:calc(var(--h)*.055);
  background:linear-gradient(140deg,var(--pc),var(--pd));box-shadow:0 4px 10px #0003,inset 0 2px 0 #ffffff55;transition:transform .12s}
.ctr:active{transform:scale(.88)}
.ctr svg{width:38%;height:38%;fill:#fff}
.eng{position:absolute;bottom:calc(var(--h)*.028);font-size:calc(var(--h)*.026);letter-spacing:3px;color:#ffffffb0;font-weight:500;text-shadow:0 1px 0 #0003}

.slot:not(.on) .wh *,.slot:not(.on) .scr-in *{visibility:hidden}
.slot:not(.on){filter:saturate(.95)}
.slot.on{z-index:5}

/* track list panel */
.panel{min-height:0;display:flex;flex-direction:column;background:var(--wheel);border-radius:28px;box-shadow:12px 12px 28px var(--lo),-12px -12px 28px var(--hi);padding:20px 14px 14px}
.ph{display:flex;align-items:center;gap:12px;padding:0 8px 6px}
.ph .em{font-size:36px}
.ph h2{margin:0;font-size:24px;font-weight:700}
.pc{font-size:14px;color:var(--ink2);padding:0 8px 12px}
.list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:2px;padding:2px}
.it{all:unset;display:grid;grid-template-columns:36px minmax(0,1fr);align-items:center;gap:10px;padding:12px 10px;border-radius:16px;cursor:pointer;transition:background .25s,transform .12s}
.it:active{transform:scale(.97)}
.it .n{text-align:center;font-size:14px;color:var(--ink3)}
.it .a{font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .b{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it.hl{background:#00000009}
.it.cur{background:linear-gradient(140deg,var(--c),var(--d));color:#fff}
.it.cur .n,.it.cur .b{color:#ffffffcc}
.open{all:unset;cursor:pointer;margin-top:12px;text-align:center;padding:14px;border-radius:18px;font-size:16px;font-weight:500;color:#fff;background:linear-gradient(140deg,var(--c),var(--d));box-shadow:0 6px 14px #0002}

/* bottom nav */
.nav{display:flex;justify-content:center;gap:18px;padding-top:12px}
.nb{all:unset;cursor:pointer;border-radius:99px;background:var(--bg);box-shadow:7px 7px 16px var(--lo),-7px -7px 16px var(--hi);padding:16px 32px;font-size:18px;font-weight:500;color:var(--ink)}
.nb:active{box-shadow:inset 5px 5px 12px var(--lo),inset -5px -5px 12px var(--hi)}

/* overlays */
.ov{position:fixed;inset:0;background:#e9ecf2ee;display:flex;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.ov[hidden]{display:none}
.card{background:var(--wheel);border-radius:34px;box-shadow:20px 20px 44px var(--lo),-16px -16px 36px var(--hi);padding:40px 44px;max-width:520px;text-align:center}
.card .big{font-size:72px;line-height:1}
.card h2{font-size:30px;margin:14px 0 8px}
.card p{font-size:17px;color:var(--ink2);line-height:1.6;margin:0 0 22px}
.go{all:unset;cursor:pointer;padding:16px 34px;border-radius:99px;background:#1db954;color:#fff;font-size:19px;font-weight:500;box-shadow:0 8px 18px #1db95455}
.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%) translateY(20px);background:#2b3140;color:#fff;padding:14px 22px;border-radius:16px;font-size:16px;max-width:80vw;text-align:center;opacity:0;transition:all .35s var(--ease);z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast a{color:#9ff5b8;pointer-events:auto}

@media (max-width:820px){
  .stage{grid-template-columns:1fr;grid-template-rows:62% 38%}
  .nano{--h:min(46vh,440px)}
}
@media (prefers-reduced-motion:reduce){
  .slot,.badge{transition:none}
  .playing .eq i{animation:none;height:60%}
}
</style>
</head>

</div>

/* ---------- state ---------- */
let cur=0, hl=0, playIdx=-1, playing=false, progMs=0, durMs=0, lastSync=0, playCtx=null;
const $=id=>document.getElementById(id);
const car=$('car'), list=$('list');
let ls={};try{ls=window.localStorage}catch(e){}
const store={get:k=>{try{return ls.getItem(k)}catch(e){return null}},set:(k,v)=>{try{ls.setItem(k,v)}catch(e){}},del:k=>{try{ls.removeItem(k)}catch(e){}}};

/* ---------- sound ---------- */
let ac=null;
function tick(f=1800,len=.03,vol=.05){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(vol,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+len);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+len+.01)}catch(e){}}

function toast(html,ms=3800){const t=$('toast');t.innerHTML=html;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),ms)}

/* ---------- build carousel ---------- */
const PLAY='<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>';
const PAUSE='<svg viewBox="0 0 24 24"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/></svg>';
const slots=P.map((p,i)=>{
  const el=document.createElement('div');el.className='slot';el.style.setProperty('--pc',p.c);el.style.setProperty('--pd',p.d);
  el.innerHTML=`<div class="badge" aria-hidden="true">${p.e}</div><div class="bname">${p.n}</div>
  <div class="nano"><div class="scr"><div class="scr-in">
    <div class="st"><span class="stt"></span><span class="cnt"></span></div>
    <div class="pn">${p.e} ${p.n}</div><div class="tn" dir="auto"></div><div class="an" dir="auto"></div>
    <div class="eq">${'<i></i>'.repeat(9)}</div><div class="bar"><b></b></div></div></div>
    <div class="wh">
      <button class="wb menu" data-a="menu" type="button" aria-label="תפריט">MENU</button>
      <button class="wb prev" data-a="prev" type="button" aria-label="שיר קודם">⏮</button>
      <button class="wb next" data-a="next" type="button" aria-label="שיר הבא">⏭</button>
      <button class="wb pp" data-a="play" type="button" aria-label="נגן או עצור" dir="ltr">▶❙❙</button>
      <button class="ctr" data-a="center" type="button" aria-label="נגן או עצור">${PLAY}</button>
    </div><div class="eng">לירם · 13</div></div>`;
  el.addEventListener('click',e=>{
    if(i!==cur){select(i);return}
    const b=e.target.closest('[data-a]');if(!b)return;act(b.dataset.a);
  });
  car.appendChild(el);return el;
});

function layout(){
  const w=car.clientWidth, nanoW=slots[cur].querySelector('.nano').offsetWidth;
  const small=.36, gap=nanoW*small+26;
  slots.forEach((el,i)=>{
    let d=i-cur;
    const on=d===0, s=on?1:small;
    const x=on?0:-(Math.sign(d)*(nanoW/2+28+gap*(Math.abs(d)-.5)));
    el.classList.toggle('on',on);
    el.style.transform=`translateX(calc(-50% + ${x}px)) scale(${s})`;
    el.style.opacity=Math.abs(d)>4?0:1;
    el.style.zIndex=10-Math.abs(d);
    el.querySelector('.badge').style.transform=on?'':`scale(${1/small*.5})`;
    el.querySelector('.bname').style.transform=on?'':`scale(${1/small*.42}) translateY(30px)`;
  });
}

/* ---------- list ---------- */
function renderList(){
  const p=P[cur];document.documentElement.style.setProperty('--c',p.c);document.documentElement.style.setProperty('--d',p.d);
  $('pEm').textContent=p.e;$('pName').textContent=p.n;$('pCount').textContent=p.s.length+' שירים · נוגעים בשיר כדי לנגן אותו';
  $('openSp').href='https://open.spotify.com/playlist/'+p.id;
  const isCtx=playCtx===p.id;
  list.innerHTML=p.s.map((s,i)=>`<button class="it${isCtx&&i===playIdx?' cur':''}${i===hl&&!(isCtx&&i===playIdx)?' hl':''}" data-i="${i}" type="button" role="listitem"><span class="n">${isCtx&&i===playIdx&&playing?'▶':i+1}</span><span style="min-width:0"><div class="a" dir="auto">${esc(s.name)}</div><div class="b" dir="auto">${esc(s.artist)}</div></span></button>`).join('');
}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function scrollTo(i){const b=list.querySelector(`[data-i="${i}"]`);if(b)b.scrollIntoView({block:'nearest',behavior:'smooth'})}
list.addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(!b)return;hl=+b.dataset.i;playAt(hl)});

function renderScreen(){
  slots.forEach((el,i)=>{
    const p=P[i], isCtx=playCtx===p.id, idx=isCtx&&playIdx>=0?playIdx:(i===cur?hl:0), s=p.s[idx]||{};
    el.querySelector('.nano').classList.toggle('playing',isCtx&&playing);
    el.querySelector('.stt').textContent=isCtx?(playing?'▶ מנגן':'❙❙ מושהה'):'מוכן לנגן';
    el.querySelector('.cnt').textContent=(idx+1)+'/'+p.s.length;
    el.querySelector('.tn').textContent=s.name||'';
    el.querySelector('.an').textContent=s.artist||'';
    el.querySelector('.ctr').innerHTML=isCtx&&playing?PAUSE:PLAY;
  });
}
function render(){renderList();renderScreen();layout()}

function select(i){cur=(i+P.length)%P.length;hl=playCtx===P[cur].id&&playIdx>=0?playIdx:0;tick(1400);render();list.scrollTop=0;if(hl)scrollTo(hl)}
$('pv').onclick=()=>select(cur-1);
$('nx').onclick=()=>select(cur+1);

/* swipe on carousel (RTL: swipe right -> next) */
let sx=null;car.addEventListener('pointerdown',e=>{if(e.target.closest('.wh'))return;sx=e.clientX});
car.addEventListener('pointerup',e=>{if(sx==null)return;const dx=e.clientX-sx;sx=null;if(Math.abs(dx)>50)select(cur+(dx>0?1:-1))});

/* click-wheel rotation: drag around the ring to move highlight */
car.addEventListener('pointerdown',e=>{
  const wh=e.target.closest('.slot.on .wh');if(!wh||e.target.closest('.ctr'))return;
  const r=wh.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  let last=Math.atan2(e.clientY-cy,e.clientX-cx),acc=0,moved=false;
  const mv=ev=>{const a=Math.atan2(ev.clientY-cy,ev.clientX-cx);let da=a-last;if(da>Math.PI)da-=2*Math.PI;if(da<-Math.PI)da+=2*Math.PI;last=a;acc+=da;
    while(Math.abs(acc)>.42){const st=acc>0?1:-1;acc-=st*.42;moved=true;hl=Math.max(0,Math.min(P[cur].s.length-1,hl+st));tick(2600,.012,.04);renderList();renderScreen();scrollTo(hl)}};
  const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);if(moved)wh._dragged=Date.now()};
  addEventListener('pointermove',mv);addEventListener('pointerup',up);
});

/* ---------- actions ---------- */
function act(a){
  const wh=slots[cur].querySelector('.wh');if(wh._dragged&&Date.now()-wh._dragged<250)return;
  const p=P[cur];
  if(a==='menu'){tick(1200);hl=playCtx===p.id&&playIdx>=0?playIdx:hl;renderList();scrollTo(hl);return}
  if(a==='next'){tick(2000);if(playCtx===p.id&&token())return withDevice(dev=>api('POST','/me/player/next'+(dev?'?device_id='+dev:''),null,true)).then(r=>{if(r!==true){playAt(Math.min(playIdx+1,p.s.length-1));return}playIdx=Math.min(playIdx+1,p.s.length-1);hl=playIdx;render();scrollTo(hl);soon()});hl=Math.min(hl+1,p.s.length-1);render();scrollTo(hl);return}
  if(a==='prev'){tick(1600);if(playCtx===p.id&&token())return withDevice(dev=>api('POST','/me/player/previous'+(dev?'?device_id='+dev:''),null,true)).then(r=>{if(r!==true){playAt(Math.max(playIdx-1,0));return}playIdx=Math.max(playIdx-1,0);hl=playIdx;render();scrollTo(hl);soon()});hl=Math.max(hl-1,0);render();scrollTo(hl);return}
  if(a==='play'){tick(900);toggle();return}
  if(a==='center'){tick(900);if(playCtx===p.id&&(hl===playIdx))toggle();else playAt(hl);}
}

function toggle(){
  const p=P[cur];
  if(playCtx!==p.id){playAt(hl);return}
  if(!token()){openTrack(p,hl);return}
  if(playing){api('PUT','/me/player/pause').then(()=>{playing=false;render()})}
  else{withDevice(dev=>api('PUT','/me/player/play'+(dev?'?device_id='+dev:''),null,true)).then(r=>{if(r===true){playing=true;render();soon()}else{pending={ctx:p.id,idx:playIdx<0?hl:playIdx};wakeSpotify(p,pending.idx)}})}
}

async function playAt(i){
  const p=P[cur];hl=i;
  if(!token()){openTrack(p,i);return}
  const body={context_uri:'spotify:playlist:'+p.id,offset:{position:i},position_ms:0};
  const ok=await withDevice(dev=>api('PUT','/me/player/play'+(dev?'?device_id='+dev:''),body,true));
  if(ok!==true){
    if(ok==='nodevice'){pending={ctx:p.id,idx:i};wakeSpotify(p,i)}
    else toast('ספוטיפיי לא הצליח לנגן. נסו שוב.');
    return}
  pending=null;playCtx=p.id;playIdx=i;playing=true;progMs=0;durMs=0;lastSync=Date.now();render();scrollTo(i);wake();soon();
}
/* try: active device -> remembered device (transfer) -> any listed device */
async function withDevice(call){
  let r=await call(null);if(r!=='nodevice')return r;
  const saved=store.get('sp_dev');
  if(saved){
    await api('PUT','/me/player',{device_ids:[saved],play:false},true);
    await sleep(500);
    r=await call(saved);if(r!=='nodevice'&&r!==false)return r;
  }
  const dev=await pickDevice();
  if(dev){store.set('sp_dev',dev.id);r=await call(dev.id);if(r!=='nodevice'&&r!==false)return r}
  return 'nodevice';
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let pending=null;
function wakeSpotify(p,i){
  const s=p.s[i];const uri=s&&s.uri?s.uri:'spotify:playlist:'+p.id;
  toast('ספוטיפיי באייפד נרדם. <a href="'+uri+'">נגעו כאן כדי להעיר אותו</a>, ואז חזרו לכאן. השיר יתחיל לבד.',12000);
}
/* when returning to this page after waking Spotify, retry the pending song a few times */
async function retryPending(){
  if(!pending||!token())return;
  const want=pending;
  for(let k=0;k<6&&pending===want;k++){
    await sleep(1200);
    const pi=P.findIndex(x=>x.id===want.ctx);if(pi<0)return;
    if(cur!==pi){cur=pi;render()}
    const body={context_uri:'spotify:playlist:'+want.ctx,offset:{position:want.idx},position_ms:0};
    const r=await withDevice(dev=>api('PUT','/me/player/play'+(dev?'?device_id='+dev:''),body,true));
    if(r===true){pending=null;playCtx=want.ctx;playIdx=want.idx;hl=want.idx;playing=true;lastSync=Date.now();toast('מנגן ✓',1800);render();scrollTo(want.idx);soon();return}
  }
}
function openTrack(p,i){
  const s=p.s[i];const url=s&&s.uri?'https://open.spotify.com/track/'+s.uri.split(':').pop():'https://open.spotify.com/playlist/'+p.id;
  toast('כדי לנגן מכאן צריך להתחבר לספוטיפיי. <a href="'+url+'" target="_blank" rel="noopener">פתיחת השיר בספוטיפיי</a>',6000);
}
async function pickDevice(){
  const r=await api('GET','/me/player/devices');if(!r||!r.devices||!r.devices.length)return null;
  return r.devices.find(d=>d.is_active)||r.devices.find(d=>/tablet|smartphone/i.test(d.type))||r.devices[0];
}

/* ---------- sync with Spotify ---------- */
let syncT=null;function soon(){clearTimeout(syncT);syncT=setTimeout(sync,900)}
async function sync(){
  if(!token())return;
  const r=await api('GET','/me/player');
  if(r&&r.device&&r.device.id)store.set('sp_dev',r.device.id);
  if(r&&r.item){
    playing=!!r.is_playing;progMs=r.progress_ms||0;durMs=r.item.duration_ms||0;lastSync=Date.now();
    const ctx=r.context&&r.context.uri&&r.context.uri.split(':').pop();
    const pi=P.findIndex(p=>p.id===ctx);
    if(pi>=0){const idx=P[pi].s.findIndex(s=>s.uri===r.item.uri);playCtx=P[pi].id;if(idx>=0)playIdx=idx;
      else{playIdx=-1;P[pi].s.forEach((s,k)=>{if(s.name===r.item.name)playIdx=k})}}
    else{playCtx=null}
  }else if(r===null){playing=false}
  renderList();renderScreen();
}
setInterval(()=>{if(document.hidden)return;sync()},4000);
setInterval(()=>{
  slots.forEach((el,i)=>{const b=el.querySelector('.bar b');
    if(playCtx===P[i].id&&durMs){const ms=progMs+(playing?Date.now()-lastSync:0);b.style.width=Math.min(100,ms/durMs*100)+'%'}else b.style.width='0'});
},250);

/* keep screen awake while playing */
let wl=null;async function wake(){try{if('wakeLock' in navigator&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>wl=null)}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(pending)retryPending();else sync();if(playing)wake()}});
addEventListener('pageshow',()=>{if(pending)retryPending()});
addEventListener('focus',()=>{if(pending)retryPending()});

/* ---------- auth (PKCE) ---------- */
function token(){const t=store.get('sp_tok'),x=+store.get('sp_exp')||0;return t&&Date.now()<x?t:(store.get('sp_ref')?'refresh':null)}
async function ensureToken(){
  let t=store.get('sp_tok'),x=+store.get('sp_exp')||0;
  if(t&&Date.now()<x-30000)return t;
  const ref=store.get('sp_ref');if(!ref)return null;
  const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'refresh_token',refresh_token:ref,client_id:CLIENT_ID})});
  if(!r.ok){logout();return null}
  saveTok(await r.json());return store.get('sp_tok');
}
function saveTok(j){store.set('sp_tok',j.access_token);store.set('sp_exp',String(Date.now()+j.expires_in*1000));if(j.refresh_token)store.set('sp_ref',j.refresh_token)}
function logout(){['sp_tok','sp_exp','sp_ref'].forEach(store.del);setAcct()}
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
async function login(){
  const v=b64(crypto.getRandomValues(new Uint8Array(48)));store.set('sp_ver',v);
  const ch=b64(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
  location.href='https://accounts.spotify.com/authorize?'+new URLSearchParams({client_id:CLIENT_ID,response_type:'code',redirect_uri:REDIRECT,code_challenge_method:'S256',code_challenge:ch,scope:SCOPES});
}
async function handleRedirect(){
  const q=new URLSearchParams(location.search),code=q.get('code');
  if(q.get('error')){history.replaceState(null,'',REDIRECT);toast('ההתחברות בוטלה.');return}
  if(!code)return;
  const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'authorization_code',code,redirect_uri:REDIRECT,client_id:CLIENT_ID,code_verifier:store.get('sp_ver')||''})});
  history.replaceState(null,'',REDIRECT);
  if(r.ok){saveTok(await r.json());toast('מחובר לספוטיפיי ✓')}else toast('ההתחברות לא הצליחה. נסו שוב.');
}
async function api(method,path,body,playCall){
  const t=await ensureToken();if(!t)return false;
  try{
    const r=await fetch('https://api.spotify.com/v1'+path,{method,headers:{Authorization:'Bearer '+t,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});
    if(r.status===204||r.status===202)return method==='GET'?null:true;
    if(r.status===404&&playCall)return 'nodevice';
    if(r.status===401){store.del('sp_tok');return false}
    if(!r.ok)return false;
    const txt=await r.text();if(!txt)return true;try{return JSON.parse(txt)}catch(_){return true};
  }catch(e){if(navigator.onLine===false)toast('אין חיבור לאינטרנט.');return false}
}

/* load real tracklists from the account (keeps site in sync with Spotify) */
async function loadPlaylists(){
  for(const p of P){
    let url='/playlists/'+p.id+'/items?limit=50',out=[];
    while(url){const r=await api('GET',url);if(!r||!r.items)break;
      r.items.forEach(x=>{const it=x.item||x.track;if(it&&it.uri)out.push({name:it.name,artist:(it.artists||[]).map(a=>a.name).join(', '),uri:it.uri})});
      url=r.next?r.next.replace('https://api.spotify.com/v1',''):null}
    if(out.length)p.s=out;
  }
  render();sync();
}

function setAcct(){const ok=!!token();const c=$('acct');c.classList.toggle('ok',ok);c.querySelector('span').textContent=ok?'מחובר לספוטיפיי':'לא מחובר לספוטיפיי'}
$('acct').onclick=()=>{if(token()){if(confirmOut())logout()}else $('login').hidden=false};
function confirmOut(){toast('לנתק? לחצו שוב תוך 3 שניות.');const n=Date.now();if($('acct')._t&&n-$('acct')._t<3000){$('acct')._t=0;return true}$('acct')._t=n;return false}
$('loginBtn').onclick=login;
$('skip').onclick=()=>{$('login').hidden=true;store.set('sp_skip','1')};

/* ---------- start ---------- */
addEventListener('resize',layout);
(async()=>{
  render();
  await handleRedirect();setAcct();
  if(token()){loadPlaylists()}else if(!store.get('sp_skip'))$('login').hidden=false;
})();
</script>
