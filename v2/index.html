<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f3f1ff">
<title>הפלייליסטים של לירם</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f1ff;--ink:#1e1b2e;--ink2:#6a6480;--card:#fff;--c:#7c4dff;--d:#5a2fd6;--ease:cubic-bezier(.2,.9,.3,1.15)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Rubik,system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--c);outline-offset:3px}
.app{height:100%;overflow-y:auto;padding:max(22px,env(safe-area-inset-top)) max(28px,env(safe-area-inset-right)) 140px max(28px,env(safe-area-inset-left))}
.top{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:0 0 26px;padding-top:6px}
.top .big13{position:absolute;inset-inline-end:180px;top:-34px;font-family:Karantina,sans-serif;font-weight:700;font-size:200px;line-height:1;color:transparent;-webkit-text-stroke:2px #7c4dff2e;pointer-events:none;letter-spacing:-4px}
.top h1{position:relative;margin:0;font-family:Karantina,sans-serif;font-weight:700;font-size:clamp(64px,8vw,104px);line-height:.82;letter-spacing:-1px}
.top h1 span{display:block;font-size:.46em;font-weight:400;letter-spacing:1px;color:var(--ink2);line-height:1.1}
.top p{position:relative;margin:12px 0 0;color:var(--ink2);font-size:15px;max-width:36ch}
.chip{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:99px;background:#fff;box-shadow:0 2px 0 #00000010,0 6px 16px #3a2a8a14;font-size:14px;color:var(--ink2)}
.chip i{width:10px;height:10px;border-radius:50%;background:#e24b4a}.chip.ok i{background:#1db954}

/* tiles */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:20px}
.tile{all:unset;cursor:pointer;position:relative;aspect-ratio:1;border-radius:26px;overflow:hidden;background:linear-gradient(150deg,var(--pc),var(--pd));box-shadow:0 3px 0 #00000014,0 14px 30px -10px var(--pd);transition:transform .25s var(--ease),box-shadow .25s}
.tile:active{transform:scale(.95)}
.tile .art{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .5s}
.tile .art.on{opacity:1}
.tile .shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,#0009 100%)}
.tile .emo{position:absolute;top:12px;right:12px;width:52px;height:52px;border-radius:16px;background:#ffffffe6;display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 4px 10px #0002}
.tile .nm{position:absolute;right:16px;left:16px;bottom:34px;color:#fff;font-family:Karantina,sans-serif;font-weight:700;font-size:44px;line-height:.86;text-shadow:0 2px 10px #0005}
.tile .ct{position:absolute;right:16px;bottom:12px;color:#ffffffd9;font-size:13px;font-weight:500;letter-spacing:.3px;font-variant-numeric:tabular-nums}
.tile .eqm{position:absolute;top:14px;left:14px;display:none;gap:3px;align-items:flex-end;height:22px;padding:6px 7px;border-radius:10px;background:#0006}
.tile.live .eqm{display:flex}
.eqm i{width:4px;background:#fff;border-radius:2px;animation:eq .8s infinite ease-in-out}
.eqm i:nth-child(2){animation-delay:.2s}.eqm i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:5px}50%{height:20px}}
.tile.mine{grid-column:span 2;aspect-ratio:auto}
.tile.mine .nm{font-size:64px;left:30%}
.tile.mine .ct::before{content:"מה שלירם בחר · "}

/* sheets (blurred backdrop) */
.veil{position:fixed;inset:0;z-index:30;background:#1e1b2e33;backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);opacity:0;pointer-events:none;transition:opacity .3s}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:31;left:50%;top:50%;width:min(920px,92vw);height:min(720px,86vh);transform:translate(-50%,-46%) scale(.94);opacity:0;pointer-events:none;transition:all .4s var(--ease);background:#fff;border-radius:34px;box-shadow:0 40px 90px -20px #1e1b2e66;display:grid;grid-template-columns:300px minmax(0,1fr);overflow:hidden}
.sheet.on{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
.side{padding:72px 28px 28px;background:linear-gradient(170deg,var(--c),var(--d));color:#fff;display:flex;flex-direction:column;gap:14px}
.cover{width:100%;aspect-ratio:1;border-radius:22px;background:#ffffff33 center/cover;box-shadow:0 18px 30px -12px #0007;display:flex;align-items:center;justify-content:center;font-size:90px}
.side h2{margin:4px 0 0;font-family:Karantina,sans-serif;font-size:64px;font-weight:700;line-height:.84;letter-spacing:-.5px}
.side .emo2{font-size:30px;display:block;margin-bottom:6px}
.side .meta{color:#ffffffd9;font-size:14px;font-weight:500;letter-spacing:.3px;margin-top:10px;font-variant-numeric:tabular-nums}
.btns{display:flex;gap:10px;margin-top:auto}
.pbtn{all:unset;cursor:pointer;flex:1;text-align:center;padding:15px 10px;border-radius:18px;background:#fff;color:var(--d);font-weight:700;font-size:17px;transition:transform .12s}
.pbtn.alt{background:#ffffff2a;color:#fff;flex:0 0 58px}
.pbtn:active{transform:scale(.94)}
.x{all:unset;cursor:pointer;position:absolute;top:16px;right:16px;width:44px;height:44px;border-radius:50%;background:#ffffffd9;color:var(--ink);box-shadow:0 4px 12px #0002;display:flex;align-items:center;justify-content:center;font-size:20px;z-index:2}
.tracks{overflow-y:auto;padding:24px 18px 18px;display:flex;flex-direction:column;gap:2px}
.tr{all:unset;cursor:pointer;display:grid;grid-template-columns:34px 50px minmax(0,1fr);align-items:center;gap:12px;padding:8px 10px;border-radius:16px;transition:background .2s}
.tr:active{background:#0000000a}
.tr .n{text-align:center;color:#b9b3cc;font-family:Karantina,sans-serif;font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.tr .th{width:50px;height:50px;border-radius:10px;background:#eee center/cover}
.tr .a,.tr .b{text-align:right}
.tr .a{font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .b{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr.cur{background:linear-gradient(140deg,var(--c),var(--d));color:#fff}.tr.cur .b,.tr.cur .n{color:#ffffffcc}

/* CD */
.cd{border-radius:50%;position:relative;background:#ddd center/cover;box-shadow:0 10px 30px -8px #0008,inset 0 0 0 1px #ffffff55;animation:spin 6s linear infinite;animation-play-state:paused}
.cd::before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle,#ffffff00 0 3px,#ffffff10 3px 4px),conic-gradient(from 30deg,#ffffff00,#ffffff55,#ffffff00 25%,#ffffff00 50%,#ffffff44,#ffffff00 75%)}
.cd::after{content:"";position:absolute;left:50%;top:50%;width:22%;height:22%;transform:translate(-50%,-50%);border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 5px #ffffffcc,0 0 0 2px #0002}
.playing .cd{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}

/* mini player */
.mini{position:fixed;z-index:20;bottom:max(20px,env(safe-area-inset-bottom));left:20px;width:min(420px,calc(100vw - 40px));display:flex;align-items:center;gap:14px;padding:12px 14px 12px 12px;background:#fffffff2;border-radius:28px;box-shadow:0 20px 50px -12px #3a2a8a55;transform:translateY(160%);transition:transform .5s var(--ease);cursor:pointer}
.mini.on{transform:none}
.mini .cd{width:64px;height:64px;flex:0 0 64px}
.mini .tx{min-width:0;flex:1}
.mini .t1{font-family:Karantina,sans-serif;font-weight:700;font-size:30px;line-height:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .t2{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{all:unset;cursor:pointer;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:transform .12s}
.ib:active{transform:scale(.85)}
.ib svg{width:22px;height:22px;fill:currentColor}
.ib.main{background:linear-gradient(140deg,var(--c),var(--d));color:#fff}
.mini .bar{position:absolute;left:24px;right:24px;bottom:5px;height:3px;border-radius:2px;background:#0000000f;overflow:hidden}
.bar b{display:block;height:100%;width:0;background:var(--c);border-radius:2px}

/* full player */
.full{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .35s;overflow:hidden}
.full.on{opacity:1;pointer-events:auto}
.full .bgart{position:absolute;inset:-60px;background:var(--c) center/cover;filter:blur(60px) saturate(1.4) brightness(.75);transform:scale(1.1)}
.full .bgtint{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,transparent,#0007)}
.viz{position:absolute;left:0;right:0;bottom:0;height:38%;display:flex;align-items:flex-end;gap:6px;padding:0 6px;opacity:.18;-webkit-mask-image:linear-gradient(transparent,#000 60%);mask-image:linear-gradient(transparent,#000 60%)}
.viz i{flex:1;background:#fff;border-radius:6px 6px 0 0;height:8%;transition:height .25s ease}
.rings{position:absolute;left:50%;top:44%;width:10px;height:10px}
.rings span{position:absolute;left:50%;top:50%;width:min(60vh,60vw);aspect-ratio:1;border-radius:50%;border:2px solid #ffffff55;transform:translate(-50%,-50%) scale(.6);opacity:0}
.full.playing .rings span{animation:ring 3.6s infinite ease-out}
.rings span:nth-child(2){animation-delay:1.2s!important}.rings span:nth-child(3){animation-delay:2.4s!important}
@keyframes ring{0%{transform:translate(-50%,-50%) scale(.6);opacity:.7}100%{transform:translate(-50%,-50%) scale(1.5);opacity:0}}
.fwrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;color:#fff;text-align:center;width:min(560px,90vw)}
.full .cd{width:min(46vh,62vw);height:min(46vh,62vw)}
.full .t1{font-family:Karantina,sans-serif;font-size:clamp(56px,7vw,92px);font-weight:700;line-height:.9;letter-spacing:-.5px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.full .t2{font-size:18px;font-weight:500;color:#ffffffd9;margin-top:-16px;letter-spacing:.3px}
.full .pl{font-family:Karantina,sans-serif;font-size:30px;color:#ffffffb3;letter-spacing:.5px}
.fbar,.mini .bar{direction:ltr}
.fbar{width:100%;height:6px;border-radius:3px;background:#ffffff33;overflow:hidden}.fbar b{background:#fff}
.ctrls{display:flex;align-items:center;gap:28px;direction:ltr}
.ctrls .ib{width:66px;height:66px;color:#fff;background:#ffffff22}
.ctrls .ib svg{width:30px;height:30px}
.ctrls .ib.main{width:92px;height:92px;background:#fff;color:var(--d)}
.ctrls .ib.main svg{width:40px;height:40px}
.full .x{background:#ffffff26;color:#fff;top:max(20px,env(safe-area-inset-top));right:20px;left:auto;width:52px;height:52px;box-shadow:none}

.toast{position:fixed;bottom:120px;left:50%;transform:translateX(-50%) translateY(20px);background:#1e1b2e;color:#fff;padding:14px 22px;border-radius:16px;font-size:16px;max-width:80vw;text-align:center;opacity:0;transition:all .35s var(--ease);z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast a{color:#9ff5b8;pointer-events:auto}
.login{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:#f3f1ffcc;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.login[hidden]{display:none}
.login .card{background:#fff;border-radius:34px;padding:40px 44px;max-width:520px;text-align:center;box-shadow:0 30px 70px -20px #3a2a8a55}
.login h2{font-family:Karantina,sans-serif;font-size:60px;line-height:.9;margin:12px 0 10px}.login p{font-size:17px;color:var(--ink2);line-height:1.6;margin:0 0 22px}
.go{all:unset;cursor:pointer;padding:16px 34px;border-radius:99px;background:#1db954;color:#fff;font-size:19px;font-weight:500}
@media (max-width:760px){.sheet{grid-template-columns:1fr;grid-template-rows:auto 1fr}.side{flex-direction:row;align-items:center}.cover{width:90px;font-size:40px}.btns{margin:0}.tile.mine{grid-column:span 1;aspect-ratio:1}}
@media (prefers-reduced-motion:reduce){.cd,.eqm i,.rings span{animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="big13" aria-hidden="true">13</div><div><h1><span>הפלייליסטים של</span>לירם</h1><p>בוחרים קובייה, ונוגעים בשיר כדי לנגן אותו</p></div>
    <button class="chip" id="acct" type="button"><i></i><span>לא מחובר לספוטיפיי</span></button>
  </header>
  <main class="grid" id="grid"></main>
</div>

<div class="veil" id="veil"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sName">
  <button class="x" id="sClose" type="button" aria-label="סגירה">✕</button>
  <div class="side">
    <div class="cover" id="sCover"></div>
    <div><h2 id="sName"></h2><div class="meta" id="sMeta"></div></div>
    <div class="btns">
      <button class="pbtn" id="sPlay" type="button">▶ ניגון</button>
      <button class="pbtn alt" id="sShuf" type="button" aria-label="ניגון אקראי">🔀</button>
      <a class="pbtn alt" id="sOpen" target="_blank" rel="noopener" aria-label="פתיחה בספוטיפיי" style="display:flex;align-items:center;justify-content:center">↗</a>
    </div>
  </div>
  <div class="tracks" id="sList"></div>
</section>

<div class="mini" id="mini" role="button" tabindex="0" aria-label="פתיחת הנגן">
  <div class="cd" id="mCd"></div>
  <div class="tx"><div class="t1" id="mT" dir="auto"></div><div class="t2" id="mA" dir="auto"></div></div>
  <div style="display:flex;gap:4px;direction:ltr">
  <button class="ib" data-a="prev" type="button" aria-label="שיר קודם"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM9.5 12 19 5v14z"/></svg></button>
  <button class="ib main" data-a="toggle" type="button" aria-label="נגן או עצור" id="mPP"></button>
  <button class="ib" data-a="next" type="button" aria-label="שיר הבא"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM14.5 12 5 19V5z"/></svg></button>
  </div>
  <div class="bar"><b id="mBar"></b></div>
</div>

<section class="full" id="full" aria-label="נגן">
  <div class="bgart" id="fBg"></div><div class="bgtint"></div>
  <div class="viz" id="viz"></div>
  <div class="rings"><span></span><span></span><span></span></div>
  <button class="x" id="fClose" type="button" aria-label="הקטנת הנגן">⌄</button>
  <div class="fwrap">
    <div class="cd" id="fCd"></div>
    <div class="t1" id="fT" dir="auto"></div>
    <div class="t2" id="fA" dir="auto"></div>
    <div class="fbar"><b id="fBar" style="display:block;height:100%;width:0"></b></div>
    <div class="ctrls">
      <button class="ib" data-a="prev" type="button" aria-label="שיר קודם"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM9.5 12 19 5v14z"/></svg></button>
      <button class="ib main" data-a="toggle" type="button" aria-label="נגן או עצור" id="fPP"></button>
      <button class="ib" data-a="next" type="button" aria-label="שיר הבא"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM14.5 12 5 19V5z"/></svg></button>
    </div>
    <div class="pl" id="fPl"></div>
  </div>
</section>

<div class="login" id="login" hidden><div class="card"><div style="font-size:64px">🎧</div><h2>מתחברים לספוטיפיי</h2><p>מתחברים פעם אחת, ואז כל שיר שבוחרים כאן מתנגן באפליקציית ספוטיפיי.</p><button class="go" id="loginBtn" type="button">התחברות לספוטיפיי</button><p style="margin:18px 0 0;font-size:14px"><button id="skip" type="button" style="all:unset;cursor:pointer;text-decoration:underline">להמשיך בלי חיבור</button></p></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

const REDIRECT=location.origin+location.pathname.replace(/index\.html$/,'');

let ls={};try{ls=window.localStorage}catch(e){}
const store={get:k=>{try{return ls.getItem(k)}catch(e){return null}},set:(k,v)=>{try{ls.setItem(k,v)}catch(e){}},del:k=>{try{ls.removeItem(k)}catch(e){}}};
const PLAY='<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>',PAUSE='<svg viewBox="0 0 24 24"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/></svg>';
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let ac=null;function tick(f=1500){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.setValueAtTime(.04,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.05);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.06)}catch(e){}}
function setTheme(p){document.documentElement.style.setProperty('--c',p.c);document.documentElement.style.setProperty('--d',p.d)}

/* ---------- state ---------- */
let open=-1, playCtx=null, playIdx=-1, playing=false, progMs=0, durMs=0, lastSync=0, nowItem=null, pending=null;

/* ---------- tiles ---------- */
const grid=$('grid');
P.forEach((p,i)=>{const b=document.createElement('button');b.type='button';b.className='tile'+(i===0?' mine':'');b.style.setProperty('--pc',p.c);b.style.setProperty('--pd',p.d);
  b.innerHTML=`<div class="art"></div><div class="shade"></div><div class="emo" aria-hidden="true">${p.e}</div><div class="eqm" aria-hidden="true"><i></i><i></i><i></i></div><div class="nm">${esc(p.n)}</div><div class="ct">${p.s.length} שירים</div>`;
  b.onclick=()=>openSheet(i);grid.appendChild(b);p.el=b});
function paintTiles(){P.forEach(p=>{const a=p.el.querySelector('.art');if(p.cover&&!a.classList.contains('on')){a.style.backgroundImage=`url("${p.cover}")`;a.classList.add('on')}
  p.el.querySelector('.ct').textContent=p.s.length+' שירים';p.el.classList.toggle('live',playCtx===p.id&&playing)})}

/* ---------- playlist sheet ---------- */
function openSheet(i){open=i;const p=P[i];setTheme(p);tick(1300);
  $('sCover').style.backgroundImage=p.cover?`url("${p.cover}")`:'';$('sCover').textContent=p.cover?'':p.e;
  $('sName').innerHTML=(p.cover?'<span class="emo2">'+p.e+'</span>':'')+esc(p.n);$('sMeta').textContent=p.s.length+' שירים'+(mins(p)?'  ·  '+mins(p):'');$('sOpen').href='https://open.spotify.com/playlist/'+p.id;
  renderList();$('veil').classList.add('on');$('sheet').classList.add('on');
  const c=$('sList').querySelector('.cur');if(c)c.scrollIntoView({block:'center'});else $('sList').scrollTop=0}

  $('sList').innerHTML=p.s.map((s,i)=>`<button class="tr${isCtx&&i===playIdx?' cur':''}" data-i="${i}" type="button"><span class="n">${isCtx&&i===playIdx&&playing?'♪':i+1}</span><span class="th" style="${s.img?`background-image:url('${s.img}')`:`background:linear-gradient(140deg,${p.c},${p.d})`}"></span><span style="min-width:0"><div class="a" dir="auto">${esc(s.name)}</div><div class="b" dir="auto">${esc(s.artist)}</div></span></button>`).join('');

/* ---------- player UI ---------- */
function curTrack(){const pi=P.findIndex(p=>p.id===playCtx);if(pi<0)return null;return{p:P[pi],pi,s:nowItem||P[pi].s[playIdx]||{}}}
function renderPlayer(){
  const t=curTrack();$('mini').classList.toggle('on',!!t);if(!t)return;
  const {p,s}=t;const img=s.img||p.cover||'';
  ['mCd','fCd'].forEach(id=>{$(id).style.backgroundImage=img?`url("${img}")`:`linear-gradient(140deg,${p.c},${p.d})`});

  $('mT').textContent=$('fT').textContent=s.name||'';$('mA').textContent=$('fA').textContent=s.artist||'';
  $('fPl').textContent=p.e+' '+p.n;$('mPP').innerHTML=$('fPP').innerHTML=playing?PAUSE:PLAY;

/* background visualizer */
const viz=$('viz');for(let k=0;k<40;k++)viz.appendChild(document.createElement('i'));
setInterval(()=>{const bars=viz.children;for(let k=0;k<bars.length;k++){const base=playing?.25+.55*Math.abs(Math.sin(Date.now()/400+k*.6))*Math.random():.06;bars[k].style.height=(base*100)+'%'}},260);

/* progress */
setInterval(()=>{const ms=progMs+(playing?Date.now()-lastSync:0);const w=durMs?Math.min(100,ms/durMs*100)+'%':'0';$('mBar').style.width=w;$('fBar').style.width=w},300);

/* ---------- playback ---------- */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function playAt(pi,i){
  const p=P[pi];if(!token()){const s=p.s[i];toast('כדי לנגן מכאן צריך להתחבר לספוטיפיי. <a target="_blank" rel="noopener" href="'+(s&&s.uri?'https://open.spotify.com/track/'+s.uri.split(':').pop():'https://open.spotify.com/playlist/'+p.id)+'">פתיחה בספוטיפיי</a>',6000);return}
  const body={context_uri:'spotify:playlist:'+p.id,offset:{position:i},position_ms:0};
  const r=await withDevice(dev=>api('PUT','/me/player/play'+(dev?'?device_id='+dev:''),body,true));
  if(r!==true){if(r==='nodevice'){pending={ctx:p.id,idx:i};wakeSpotify(p,i)}else toast('ספוטיפיי לא הצליח לנגן. נסו שוב.');return}
  pending=null;playCtx=p.id;playIdx=i;nowItem=p.s[i];playing=true;progMs=0;durMs=p.s[i]&&p.s[i].ms||0;lastSync=Date.now();render();wake();soon();
}
async function toggle(){
  if(!playCtx)return;
  if(playing){if(await api('PUT','/me/player/pause')){playing=false;render()}return}
  const r=await withDevice(dev=>api('PUT','/me/player/play'+(dev?'?device_id='+dev:''),null,true));
  if(r===true){playing=true;lastSync=Date.now();render();soon()}else{const pi=P.findIndex(p=>p.id===playCtx);pending={ctx:playCtx,idx:Math.max(playIdx,0)};wakeSpotify(P[pi],pending.idx)}
}
async function skip(d){
  if(!playCtx)return;const pi=P.findIndex(p=>p.id===playCtx);
  const r=await withDevice(dev=>api('POST','/me/player/'+(d>0?'next':'previous')+(dev?'?device_id='+dev:''),null,true));
  if(r===true){playIdx=Math.max(0,Math.min(P[pi].s.length-1,playIdx+d));nowItem=P[pi].s[playIdx];progMs=0;lastSync=Date.now();playing=true;render();soon()}
  else playAt(pi,Math.max(0,Math.min(P[pi].s.length-1,playIdx+d)));
}
async function withDevice(call){
  let r=await call(null);if(r!=='nodevice')return r;
  const saved=store.get('sp_dev');
  if(saved){await api('PUT','/me/player',{device_ids:[saved],play:false},true);await sleep(500);r=await call(saved);if(r!=='nodevice'&&r!==false)return r}
  const dv=await api('GET','/me/player/devices');const d=dv&&dv.devices&&(dv.devices.find(x=>x.is_active)||dv.devices[0]);
  if(d){store.set('sp_dev',d.id);r=await call(d.id);if(r!=='nodevice'&&r!==false)return r}
  return 'nodevice';
}
function wakeSpotify(p,i){const s=p.s[i];toast('ספוטיפיי נרדם. <a href="'+(s&&s.uri?s.uri:'spotify:playlist:'+p.id)+'">נגעו כאן כדי להעיר אותו</a>, וחזרו לכאן. השיר יתחיל לבד.',12000)}
async function retryPending(){if(!pending||!token())return;const want=pending;
  for(let k=0;k<6&&pending===want;k++){await sleep(1200);const pi=P.findIndex(x=>x.id===want.ctx);if(pi<0)return;
    const body={context_uri:'spotify:playlist:'+want.ctx,offset:{position:want.idx},position_ms:0};
    const r=await withDevice(dev=>api('PUT','/me/player/play'+(dev?'?device_id='+dev:''),body,true));
    if(r===true){pending=null;playCtx=want.ctx;playIdx=want.idx;nowItem=P[pi].s[want.idx];playing=true;lastSync=Date.now();toast('מנגן ✓',1800);render();soon();return}}}

/* sync */
let syncT=null;function soon(){clearTimeout(syncT);syncT=setTimeout(sync,900)}
async function sync(){if(!token())return;const r=await api('GET','/me/player');
  if(r&&r.device&&r.device.id)store.set('sp_dev',r.device.id);
  if(r&&r.item){playing=!!r.is_playing;progMs=r.progress_ms||0;durMs=r.item.duration_ms||0;lastSync=Date.now();
    const im=r.item.album&&r.item.album.images&&r.item.album.images[0];nowItem={name:r.item.name,artist:(r.item.artists||[]).map(a=>a.name).join(', '),uri:r.item.uri,img:im&&im.url};
    const ctx=r.context&&r.context.uri&&r.context.uri.split(':').pop();const pi=P.findIndex(p=>p.id===ctx);
    if(pi>=0){playCtx=P[pi].id;playIdx=P[pi].s.findIndex(s=>s.uri===r.item.uri)}else{playCtx=null}
  }else if(r===null){playing=false}
  render()}
setInterval(()=>{if(!document.hidden)sync()},4000);
let wl=null;async function wake(){try{if('wakeLock' in navigator&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>wl=null)}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(pending)retryPending();else sync();if(playing)wake()}});
addEventListener('pageshow',()=>{if(pending)retryPending()});

/* ---------- auth ---------- */
function token(){const t=store.get('sp_tok'),x=+store.get('sp_exp')||0;return t&&Date.now()<x?t:(store.get('sp_ref')?'refresh':null)}
async function ensureToken(){let t=store.get('sp_tok'),x=+store.get('sp_exp')||0;if(t&&Date.now()<x-30000)return t;const ref=store.get('sp_ref');if(!ref)return null;
  const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'refresh_token',refresh_token:ref,client_id:CLIENT_ID})});
  if(!r.ok){logout();return null}saveTok(await r.json());return store.get('sp_tok')}
function saveTok(j){store.set('sp_tok',j.access_token);store.set('sp_exp',String(Date.now()+j.expires_in*1000));if(j.refresh_token)store.set('sp_ref',j.refresh_token)}
function logout(){['sp_tok','sp_exp','sp_ref'].forEach(store.del);setAcct()}
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
async function login(){const v=b64(crypto.getRandomValues(new Uint8Array(48)));store.set('sp_ver',v);const ch=b64(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
  location.href='https://accounts.spotify.com/authorize?'+new URLSearchParams({client_id:CLIENT_ID,response_type:'code',redirect_uri:REDIRECT,code_challenge_method:'S256',code_challenge:ch,scope:SCOPES})}
async function handleRedirect(){const q=new URLSearchParams(location.search),code=q.get('code');if(q.get('error')){history.replaceState(null,'',REDIRECT);return}if(!code)return;
  const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'authorization_code',code,redirect_uri:REDIRECT,client_id:CLIENT_ID,code_verifier:store.get('sp_ver')||''})});
  history.replaceState(null,'',REDIRECT);if(r.ok){saveTok(await r.json());toast('מחובר לספוטיפיי ✓')}else toast('ההתחברות לא הצליחה. נסו שוב.')}
async function api(method,path,body,playCall){const t=await ensureToken();if(!t)return false;
  try{const r=await fetch('https://api.spotify.com/v1'+path,{method,headers:{Authorization:'Bearer '+t,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});
    if(r.status===204||r.status===202)return method==='GET'?null:true;if(r.status===404&&playCall)return 'nodevice';if(r.status===401){store.del('sp_tok');return false}if(!r.ok)return false;
    const txt=await r.text();return txt?JSON.parse(txt):true}catch(e){toast('אין חיבור לאינטרנט.');return false}}

async function loadPlaylists(){
  await Promise.all(P.map(async p=>{
    const meta=await api('GET','/playlists/'+p.id+'?fields=images');if(meta&&meta.images&&meta.images[0])p.cover=meta.images[0].url;
    let url='/playlists/'+p.id+'/items?limit=50',out=[];
    while(url){const r=await api('GET',url);if(!r||!r.items)break;
      r.items.forEach(x=>{const it=x.item||x.track;if(it&&it.uri){const im=it.album&&it.album.images;out.push({name:it.name,artist:(it.artists||[]).map(a=>a.name).join(', '),uri:it.uri,ms:it.duration_ms,img:im&&(im[im.length>1?1:0]||{}).url})}});
      url=r.next?r.next.replace('https://api.spotify.com/v1',''):null}
    if(out.length)p.s=out;paintTiles();
  }));render();sync()}

function setAcct(){const ok=!!token();$('acct').classList.toggle('ok',ok);$('acct').querySelector('span').textContent=ok?'מחובר לספוטיפיי':'לא מחובר לספוטיפיי'}
$('acct').onclick=()=>{if(!token())$('login').hidden=false};
$('loginBtn').onclick=login;$('skip').onclick=()=>{$('login').hidden=true;store.set('sp_skip','1')};
addEventListener('keydown',e=>{if(e.key==='Escape'){if($('full').classList.contains('on'))$('full').classList.remove('on');else closeSheet()}});

(async()=>{render();await handleRedirect();setAcct();if(token())loadPlaylists();else if(!store.get('sp_skip'))$('login').hidden=false})();
</script>
</body>
